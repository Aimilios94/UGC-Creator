name: CI

# Every push and PR: frontend lint + build; backend ruff + pytest against a Postgres
# service container with mock providers only; a Docker build. No secrets are used:
# CI cannot make a real provider call (tests also block non-local network).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ugc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ugc_test
      LLM_PROVIDER: mock
      MEDIA_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (mock providers, Postgres service container)
        run: python -m pytest -o addopts="" -q -rs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -f backend/Dockerfile -t ugc-backend:ci .
      - name: Image starts and answers /health with no secrets
        run: |
          docker run -d --name api -p 8080:8080 -e LLM_PROVIDER=mock -e MEDIA_PROVIDER=mock ugc-backend:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && exit 0; sleep 1; done
          docker logs api; exit 1
