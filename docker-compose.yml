# Local stack: postgres (pgvector), api, worker (same job code, run in a loop), frontend.
#
#   docker compose up --build        -> http://localhost:5173 (API on :8000)
#
# Mock providers by default: no keys needed, nothing is paid. To use real providers
# (paid), set them explicitly in the shell; keys are read from backend/.env if present:
#   LLM_PROVIDER=openai MEDIA_PROVIDER=fal VOICE_PROVIDER=openai docker compose up
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: backend/.env
      required: false
  environment: &backend-env
    APP_ENV: local
    DATABASE_URL: postgresql://postgres:ugc@postgres:5432/ugc
    DATABASE_URL_DIRECT: postgresql://postgres:ugc@postgres:5432/ugc
    LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    MEDIA_PROVIDER: ${MEDIA_PROVIDER:-mock}
    VOICE_PROVIDER: ${VOICE_PROVIDER:-mock}
    STORAGE_PROVIDER: local
    STORAGE_LOCAL_DIR: /data
    ASSET_SIGNING_SECRET: local-compose-only-not-a-secret
    PUBLIC_API_URL: http://localhost:8000
    JOB_RUNNER: local
    ACCESS_CODES: ${ACCESS_CODES:-}
    DAILY_SPEND_LIMIT_EUR: ${DAILY_SPEND_LIMIT_EUR:-10}  # D31
    CORS_ORIGINS: http://localhost:5173
  volumes:
    - media:/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: ugc
      POSTGRES_DB: ugc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ugc"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *backend
    command: ["sh", "-c", "python scripts/apply_schema.py && exec uvicorn app.main:app --host 0.0.0.0 --port 8080"]
    ports:
      - "8000:8080"

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker", "--loop"]
    environment:
      <<: *backend-env
      ARCHIVE_DIR: /archive  # the findings archive (D31): every local test ad, kept outside the repo
    volumes:
      - media:/data
      - ${UGC_ARCHIVE_DIR:-../ugc-archive}:/archive
    depends_on:
      api:
        condition: service_started

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules

volumes:
  pgdata:
  media:
  frontend_modules:
