# Non-secret settings of the Cloud Run API service (secrets come from Secret Manager).
# Applied with: gcloud run services update ugc-api --env-vars-file=deploy/gcp/api.env.yaml
APP_ENV: prod
JOB_RUNNER: cloudrun
CLOUD_RUN_JOB_NAME: ugc-worker
GCP_PROJECT_ID: ugc-ad-builder
GCP_REGION: europe-west4
STORAGE_PROVIDER: gcs
GCS_BUCKET: ugc-ad-builder-media
LLM_PROVIDER: openai
MEDIA_PROVIDER: fal
# Spend limits in EUR (DECISIONS D2)
JOB_COST_CAP_EUR: "1.75"
DAILY_SPEND_LIMIT_EUR: "4"
# Production site, and the stable Vercel preview address of the v2 branch
CORS_ORIGINS: https://ugc-creator-delta.vercel.app,https://ugc-creator-git-v2-aimilios-projects-21450502.vercel.app
# Scenes rendered per ad. Stays 1 (the M1 leg) until the M2 deploy, which sets 3 with the owner's go.
RENDER_SCENES: "1"
